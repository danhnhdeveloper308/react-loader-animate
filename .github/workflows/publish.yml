name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint + Build on every push / PR ─────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Test contracts, SSR and bundle budgets
        run: npm test

  # ─── Semantic-release: auto-version + npm publish on push to main ─────────────
  release:
    name: Release
    needs: [ci, react-compatibility]
    runs-on: ubuntu-latest
    # Only runs on direct push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write      # create tags & version-bump commits
      issues: write        # comment on issues
      pull-requests: write # comment on PRs
      id-token: write      # provenance for npm publish

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use PAT if available (allows pushing version-bump commits back to main)
          # Falls back to GITHUB_TOKEN if GH_PAT secret is not configured
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: npx semantic-release

  react-compatibility:
    name: React ${{ matrix.react }} compatibility
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['16.14.0', '17.0.2', '18.3.1', '19.2.0']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install React compatibility target
        run: npm install --no-save --package-lock=false --ignore-scripts react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: Verify SSR contracts
        run: npm run test:ssr
